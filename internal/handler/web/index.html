<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APIHub</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#172033;background:#f6f8fb}h1{color:#1769aa}form,.card{background:white;padding:1rem;margin:1rem 0;border-radius:10px;box-shadow:0 2px 8px #0001}input,textarea,button{padding:.6rem;margin:.25rem;border:1px solid #ccd5e0;border-radius:6px}input,textarea{width:calc(100% - 1.5rem)}button{cursor:pointer;background:#1769aa;color:#fff}.danger{background:#b42318}.url{word-break:break-all}</style></head>
<body><h1>APIHub</h1><p>Catálogo de APIs mascaradas</p><form id="form"><input name="nome" placeholder="Nome" required><input name="slug" placeholder="Slug (ex.: clima)" required><textarea name="descricao" placeholder="Descrição"></textarea><input name="url_original" type="url" placeholder="URL original" required><button>Cadastrar rota</button></form><main id="catalogo"></main>
<script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carregar(){let r=await fetch('/api/catalogo'),a=await r.json();$('#catalogo').innerHTML=a.map(x=>`<article class="card"><h2>${esc(x.nome||x.slug)}</h2><p>${esc(x.descricao)}</p><p><b>Mascarada:</b> <span class="url">${esc(x.url_mascarada)}</span> <button onclick="navigator.clipboard.writeText('${esc(location.origin+x.url_mascarada)}')">Copiar</button></p><p><b>Original:</b> <span class="url">${esc(x.url_original)}</span></p><button onclick="editar('${esc(x.slug)}','${esc(x.url_original)}')">Editar URL</button> <button class="danger" onclick="remover('${esc(x.slug)}')">Excluir</button></article>`).join('')||'<p>Nenhuma rota cadastrada.</p>'}
$('#form').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/rotas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)alert((await r.json()).erro);else{e.target.reset();carregar()}};
async function editar(slug,atual){let url=prompt('Nova URL original:',atual);if(url&&url!==atual){let r=await fetch('/api/rotas/'+encodeURIComponent(slug),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({url_original:url})});if(!r.ok)alert((await r.json()).erro);carregar()}}async function remover(slug){if(confirm('Excluir esta rota?')){await fetch('/api/rotas/'+encodeURIComponent(slug),{method:'DELETE'});carregar()}}carregar();</script></body></html>
