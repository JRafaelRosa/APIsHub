name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verificar formatação
        run: test -z "$(gofmt -l .)"

      - name: Análise estática
        run: go vet ./...

      - name: Testes com race detector
        run: go test -v -race ./...
